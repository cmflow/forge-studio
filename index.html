<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工作助手</title>
    <style>
      /* 启动占位：内联在 HTML 里，WebView 解析完 HTML 就能显示，
         无需等待 500KB 的 JS 加载完成，覆盖首屏空白期。
         Vue 挂载到 #app 时会自动替换掉内部的占位内容。 */
      body {
        margin: 0;
        background: #f5f6f8;
      }
      #app {
        min-height: 100vh;
      }
      .boot-loading {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .boot-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #e5e7eb;
        border-top-color: #2f80ed;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-text {
        font-size: 13px;
        color: #9ca3af;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-loading">
        <div class="boot-spinner"></div>
        <div class="boot-text">正在启动…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
